version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: crazy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crazy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crazy-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - crazy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: crazy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crazy-network

networks:
  crazy-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
